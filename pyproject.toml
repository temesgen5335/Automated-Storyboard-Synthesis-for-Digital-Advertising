[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "adsynth"
version = "0.1.0"
description = "Automated Storyboard Synthesis for Digital Advertising — Creative Automation + DCO"
requires-python = ">=3.10"
dependencies = ["pillow>=10.3.0", "requests>=2.32.0", "pydantic>=2.6", "python-dotenv>=1.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
